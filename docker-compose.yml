version: "3.8"

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - prisma_data:/app/prisma
    environment:
      - DATABASE_URL=file:./dev.db
      - SESSION_SECRET=${SESSION_SECRET:-super-secret-session-key-change-in-production}
      - REQUIRE_LOGIN=${REQUIRE_LOGIN:-false}
      - PORT=${PORT:-3000}

volumes:
  prisma_data:
